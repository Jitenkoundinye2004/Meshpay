name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build

    - name: Install Backend Dependencies
      working-directory: ./backend
      run: npm ci

    - name: Run Backend Unit & AI Integration Tests
      working-directory: ./backend
      env:
        AI_PROVIDER: mock
        JWT_SECRET: ci_test_jwt_secret
      run: npm test

    - name: Run Performance Benchmark Check
      working-directory: ./backend
      env:
        AI_PROVIDER: mock
      run: npm run benchmark
